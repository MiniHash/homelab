apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-objects
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/MiniHash/homelab.git
    targetRevision: main
    path: homelab/manifests/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      